name: Android

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      registry_version:
        description: Verify this published version instead of building local JNI
        required: false
        type: string

jobs:
  android:
    if: inputs.registry_version == ''
    name: Android JNI and Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK and cargo-ndk
        run: |
          sdkmanager --install 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Build Android native libraries
        run: ./android/scripts/build-native.sh

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./scripts/run-gradle.sh :mdi-android:verifyDebugUnitTestCoverage

      - name: Upload Android coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./android/mdi-android/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
          flags: android
          name: android
          fail_ci_if_error: true

      # GitHub-hosted runners expose /dev/kvm as root:kvm.  Give the emulator
      # process access before it starts: software acceleration (`-accel off`)
      # is too slow for this API 35 image and times out during boot.
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run x86_64 instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android && ./scripts/run-gradle.sh :mdi-android:connectedDebugAndroidTest

  registry:
    if: inputs.registry_version != ''
    name: Verify published Android package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY_VERSION: ${{ inputs.registry_version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact stable version
        run: '[[ "$REGISTRY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the registry AAR and JNI without rebuilding the library
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./android/scripts/run-gradle.sh -p android/registry-consumer -PregistryVersion="$REGISTRY_VERSION" :consumer:connectedDebugAndroidTest
      - name: Record downloaded artifact checksums
        run: |
          find "$HOME/.gradle/caches/modules-2/files-2.1/app.illusions/mdi-android/$REGISTRY_VERSION" -type f -exec sha256sum {} + > android/registry-consumer/artifact-checksums.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-registry-verification-${{ inputs.registry_version }}
          path: |
            android/registry-consumer/artifact-checksums.txt
            android/registry-consumer/consumer/build/outputs/androidTest-results/
